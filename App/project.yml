name: PixelWash
options:
  bundleIdPrefix: ai.it-guy
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  autogenerateSchemes: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

schemes:
  PixelWash:
    build:
      targets:
        PixelWash: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  PixelWash:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PixelWashApp
        excludes:
          - "Info.plist"
          - "PixelWash.entitlements"
      # Geteilte Render-Engine des Screensavers (read-only mitkompiliert, nicht kopiert).
      - path: ../Sources/PixelWashCore.swift
        group: Shared
    settings:
      base:
        PRODUCT_NAME: PixelWash
        PRODUCT_BUNDLE_IDENTIFIER: ai.it-guy.pixelwash
        INFOPLIST_FILE: PixelWashApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PixelWashApp/PixelWash.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: NO
